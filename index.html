<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glint Packs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='18' height='26' rx='2' fill='%232F4BF5'/%3E%3Cpath d='M16 11c1 3 2 4 5 5-3 1-4 2-5 5-1-3-2-4-5-5 3-1 4-2 5-5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEBE5; --bg2:#F4F3EE; --ink:#1d1a17;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(120% 90% at 50% 42%, var(--bg2) 0%, var(--bg) 55%, #E3E2DB 100%);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;touch-action:none;
}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#streams{z-index:1}
#cardsLayer{position:fixed;inset:0;z-index:2;pointer-events:none}
#packLayer{position:fixed;inset:0;z-index:3;pointer-events:none}
#confetti{z-index:4}
#again{
  position:fixed;left:50%;bottom:max(36px,env(safe-area-inset-bottom));z-index:5;
  transform:translate(-50%,12px);opacity:0;pointer-events:none;
  font:600 13px/1 Inter,system-ui,sans-serif;color:#1d1a17;letter-spacing:-.005em;
  background:#fff;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 0 0 1px rgba(20,18,15,.06),0 6px 18px -6px rgba(20,18,15,.25);
  transition:opacity .35s ease,transform .35s cubic-bezier(.2,.8,.2,1),scale .08s ease,visibility .35s;
  visibility:hidden; /* hidden button must not stay focusable: Enter on it used to swap packs mid-settle */
}
#again::after{content:"";position:absolute;inset:-4px 0} /* 37px button -> 45px touch target */
#again.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;visibility:visible}
#again:active{scale:.96}
#again:focus-visible{outline:2px solid #2F4BF5;outline-offset:3px}

/* ---------- PACK ---------- */
.pack-pos{position:absolute;left:0;top:0;width:300px;height:416px;transform-origin:50% 50%;pointer-events:auto;will-change:transform}
.pack-3d{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.pack-side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pack-back{transform:rotateY(180deg)}
.pack-shadow{position:absolute;left:50%;top:100%;width:240px;height:34px;margin:22px 0 0 -120px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(40,34,28,.28),rgba(40,34,28,0));pointer-events:none}
.foil-bg{
  position:absolute;left:0;top:0;width:300px;height:416px;
  background:
    linear-gradient(180deg, rgba(0,0,0,.10) 0, rgba(0,0,0,0) 5.5%, rgba(255,255,255,.10) 6%, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 85%, rgba(255,255,255,.08) 94%, rgba(0,0,0,.12) 100%),
    linear-gradient(90deg, rgba(0,0,0,.22) 0%, rgba(255,255,255,.10) 9%, rgba(255,255,255,0) 22%, rgba(255,255,255,.0) 62%, rgba(255,255,255,.12) 80%, rgba(0,0,0,.24) 100%),
    var(--pc);
}
.foil-bg::before{ /* crimp texture */
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 1.4px, rgba(255,255,255,.08) 1.4px 2.4px, transparent 2.4px 6px);
  -webkit-mask:linear-gradient(180deg,#000 0,#000 21px,transparent 22px,transparent 394px,#000 395px);
          mask:linear-gradient(180deg,#000 0,#000 21px,transparent 22px,transparent 394px,#000 395px);
}
.foil-bg::after{ /* creases under crimp + pillow sheen */
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.12) 0 1px, transparent 1px 7px, rgba(0,0,0,.06) 7px 8px, transparent 8px 13px),
    radial-gradient(60% 40% at 30% 30%, rgba(255,255,255,.14), transparent 70%);
  -webkit-mask:linear-gradient(180deg,transparent 0,transparent 22px,#000 23px,transparent 70px,transparent 350px,#000 393px,transparent 394px);
          mask:linear-gradient(180deg,transparent 0,transparent 22px,#000 23px,transparent 70px,transparent 350px,#000 393px,transparent 394px);
}
.pack-body,.pack-lip{position:absolute;left:0;top:0;width:300px;height:416px}
.pack-lip{background:linear-gradient(180deg,#fff,#d9dce6 60%,#c4c8d6)}
.pack-body .sheen{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg, transparent 30%, rgba(255,255,255,.16) 42%, transparent 52%);
  background-size:200% 100%;background-position:var(--sx,60%) 0;mix-blend-mode:screen}
.pk-word{position:absolute;left:24px;top:76px;font-weight:800;font-size:46px;letter-spacing:-.055em;color:#fff;line-height:1}
.pk-var{position:absolute;right:24px;top:92px;font-weight:600;font-size:9.5px;letter-spacing:.2em;color:rgba(255,255,255,.82)}
.pk-foot{position:absolute;left:24px;right:24px;bottom:42px;display:flex;justify-content:space-between;font-weight:500;font-size:11px;color:rgba(255,255,255,.9)}
.pk-mascot{position:absolute;left:50%;top:232px;width:244px;height:244px;margin:-122px 0 0 -122px;pointer-events:none}
.pk-mascot img,.mascot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pk-mascot img{filter:drop-shadow(0 14px 14px rgba(0,0,30,.28))}
.strip{position:absolute;left:0;top:0;width:300px;height:60px}
.slice{position:absolute;top:0;width:10.6px;height:60px;overflow:hidden;transform-origin:0 50%}
.slice .foil-bg{left:var(--off)}
.tear-label{position:absolute;left:22px;top:31px;font-weight:700;font-size:7.5px;letter-spacing:.24em;color:rgba(255,255,255,.78);white-space:nowrap}
.tear-label.pulse{animation:pulse .7s ease 2}
@keyframes pulse{50%{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.9)}}
.pack-pos.grab{cursor:grab}
.pack-pos.grabbing{cursor:grabbing}
/* back */
.bk-seam{position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;
  background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.14) 40%,rgba(0,0,0,.12));}
.bk-word{position:absolute;left:28px;top:84px;font-weight:800;font-size:22px;letter-spacing:-.05em;color:#fff}
.bk-copy{position:absolute;left:28px;top:122px;width:100px;font-size:7.5px;line-height:1.55;color:rgba(255,255,255,.8);font-weight:500}
.bk-bar{position:absolute;left:174px;top:300px;width:84px;height:46px;background:#fff;border-radius:3px;padding:5px 6px 3px}
.bk-bar svg{display:block;width:100%;height:30px}
.bk-bar span{display:block;font-size:6px;letter-spacing:.12em;text-align:center;color:#111;margin-top:2px}

/* ---------- FACES ---------- */
.face{position:absolute;overflow:visible;pointer-events:none}
.face .eyes{transform-box:fill-box;transform-origin:50% 50%;transition:transform .07s linear}
.face.blink .eyes{transform:scaleY(.12)}
.face .ink{fill:#23161d;stroke:#23161d;stroke-linecap:round;stroke-linejoin:round}
.face .blush ellipse{fill:#ff6f96;opacity:.5}

/* ---------- CARDS ---------- */
.card-pos{position:absolute;left:0;top:0;width:300px;height:424px;transform-origin:50% 50%;will-change:transform;pointer-events:auto}
.card{
  position:absolute;inset:0;border-radius:18px;padding:14px;overflow:hidden;
  background:var(--card);color:var(--cink);
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 0 0 1px rgba(255,255,255,.28) inset,
             0 26px 34px -18px rgba(38,30,22,.45),0 6px 14px -4px rgba(38,30,22,.16);
  will-change:transform;cursor:pointer;
}
.art{position:relative;height:258px;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.06) inset,0 10px 18px -10px rgba(0,0,0,.35) inset}
.mascot{position:absolute;left:50%;top:50%;width:250px;height:250px;margin:-125px 0 0 -125px;will-change:transform}
.mascot img{filter:drop-shadow(0 16px 12px rgba(0,0,0,.28))}
.meta{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 0}
.name{font-weight:700;font-size:28px;letter-spacing:-.035em;line-height:1}
.chip{font-weight:700;font-size:9px;letter-spacing:.16em;padding:5px 8px 4px;border-radius:99px;background:color-mix(in srgb,var(--cink) 10%,transparent)}
.rule{height:1px;margin:20px 4px 16px;background:color-mix(in srgb,var(--cink) 16%,transparent)}
.foot{display:flex;justify-content:space-between;margin:0 4px;font-weight:600;font-size:10.5px}
.foot span{opacity:.72}.foot .rar{opacity:1} /* opacity on .foot capped .rar at .72 */
.card .sheen,.card .foil,.card .glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.card .sheen{background:linear-gradient(118deg,transparent 22%,rgba(255,255,255,.28) 31%,rgba(255,255,255,.06) 38%,transparent 44%,transparent 64%,rgba(255,255,255,.14) 70%,transparent 76%);
  background-size:220% 220%;background-position:var(--fx,50%) var(--fy,50%);mix-blend-mode:soft-light}
.card .foil{opacity:0;mix-blend-mode:color-dodge;
  background:
    repeating-linear-gradient(112deg,rgba(255,60,170,.55) 0%,rgba(255,220,60,.5) 7%,rgba(60,255,200,.5) 14%,rgba(70,140,255,.55) 21%,rgba(200,80,255,.55) 28%,rgba(255,60,170,.55) 35%);
  background-size:300% 300%;background-position:var(--fx,50%) var(--fy,50%);
  -webkit-mask:linear-gradient(118deg,transparent 15%,#000 40%,#000 60%,transparent 85%);mask:linear-gradient(118deg,transparent 15%,#000 40%,#000 60%,transparent 85%);
  -webkit-mask-size:200% 200%;mask-size:200% 200%;-webkit-mask-position:var(--fx,50%) var(--fy,50%);mask-position:var(--fx,50%) var(--fy,50%)}
.r-rare .foil{opacity:.22}.r-holo .foil{opacity:.5}.r-ultra .foil{opacity:.32}
.card .glare{opacity:var(--go,0);mix-blend-mode:overlay;transition:opacity .25s ease;
  background:radial-gradient(farthest-corner circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.75) 0%,rgba(255,255,255,.18) 30%,rgba(0,0,0,.18) 90%)}
/* art grounds */
.art-ripple{background:repeating-radial-gradient(circle at 50% 58%,#A8E3EF 0 11px,#C4EDF5 11px 22px)}
.art-ripple::after,.art-burst::after,.art-sprinkle::after,.art-check::after,.art-night::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 70% at 50% 55%,transparent 45%,rgba(0,0,0,.14))}
.art-sprinkle{background:
  radial-gradient(circle,#fff 0 2px,transparent 2.5px) 0 0/34px 34px,
  radial-gradient(circle,#FF8CC6 0 2px,transparent 2.5px) 17px 17px/34px 34px,
  radial-gradient(circle,#FFD34D 0 1.6px,transparent 2px) 9px 25px/34px 34px,
  #C9B3F6}
.art-check{background:
  repeating-conic-gradient(#1C7A6C 0 25%,#16685C 0 50%) 0 0/30px 30px}
.art-night{background:
  radial-gradient(circle,rgba(255,255,255,.95) 0 1px,transparent 1.6px) 0 0/16px 16px,
  radial-gradient(circle,rgba(255,255,255,.5) 0 .8px,transparent 1.2px) 8px 8px/16px 16px,
  linear-gradient(160deg,#1A2A86,#5C2B96 50%,#13707F)}
.art-burst{background:
  repeating-conic-gradient(from 0deg at 50% 58%,#FF6B3D 0 7.5deg,#FFC657 7.5deg 15deg)}
@media (prefers-reduced-motion:reduce){#again{transition:none}}
</style>
</head>
<body>
<canvas id="streams" class="fx"></canvas>
<div id="cardsLayer"></div>
<div id="packLayer"></div>
<canvas id="confetti" class="fx"></canvas>
<button id="again" type="button">Open another pack</button>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= data ================= */
const PACKS=[
  {name:'LAGOON',c:'#2F4BF5'},
  {name:'TANGERINE',c:'#C9471A'},
  {name:'GRAPE',c:'#7A3CF0'},
  {name:'MATCHA',c:'#1F7A4A'},
  {name:'CHERRY',c:'#E8335A'},
];
const RAR={common:'● Common',rare:'◆ Rare',holo:'◆◆ Holo rare',ultra:'★ Ultra rare'};
const CHARS=[
  {id:'plip', name:'Plip', type:'SPLASH',no:'009',rar:'common',hover:'happy',art:'art-ripple',
   card:'linear-gradient(160deg,#EAF9FC,#C8ECF3)',ink:'#0F2F39'},
  {id:'ollie',name:'Ollie',type:'GLAZE', no:'031',rar:'common',hover:'heart',art:'art-sprinkle',
   card:'linear-gradient(160deg,#F4EDFF,#DCCAFB)',ink:'#2A1846'},
  {id:'pilly',name:'Pilly',type:'DOSE',  no:'057',rar:'rare',  hover:'wink', art:'art-check',
   card:'linear-gradient(160deg,#17645B,#0A3036)',ink:'#F2FFFB'},
  {id:'morel',name:'Morel',type:'SPORE', no:'092',rar:'holo',  hover:'star', art:'art-night',
   card:'linear-gradient(155deg,#1D2470 0%,#5A2C8F 42%,#A8357C 70%,#177A86 100%)',ink:'#FFFFFF'},
  {id:'bolt', name:'Bolt', type:'VOLT',  no:'120',rar:'ultra', hover:'star', art:'art-burst',
   card:'linear-gradient(160deg,#FFF6C8 0%,#FFD25A 42%,#FF8F3A 100%)',ink:'#3A1E00'},
];

/* ================= 3D mascots (rendered once to images) ================= */
const ART={}; // id -> {src, fx, fy, fw}
function phys(color,o={}){return new THREE.MeshPhysicalMaterial(Object.assign({color,roughness:.18,clearcoat:1,clearcoatRoughness:.08},o))}
const B={
  plip(){
    const pts=[];for(let i=0;i<=64;i++){const t=Math.PI*i/64;pts.push(new THREE.Vector2(Math.sin(t)*Math.pow((1-Math.cos(t))/2,.85)*1.3,Math.cos(t)*1.45))}
    pts.reverse();
    const g=new THREE.Group();
    const m=new THREE.Mesh(new THREE.LatheGeometry(pts,96),phys('#2BB8F0',{roughness:.1,sheen:.5,sheenColor:new THREE.Color('#bff3ff')}));
    g.add(m);g.rotation.z=.14;
    const a=new THREE.Object3D();a.position.set(0,-.5,.86);g.add(a);g.userData.face=a;g.userData.fs=1.05;return g;
  },
  ollie(){
    const g=new THREE.Group();
    const dough=new THREE.Mesh(new THREE.TorusGeometry(1,.5,48,128),phys('#E7A35E',{roughness:.5,clearcoat:.2}));
    const ice=new THREE.Mesh(new THREE.TorusGeometry(1,.47,48,128),phys('#FF7DB8',{roughness:.12}));
    ice.scale.set(1.01,1.01,.8);ice.position.z=.13;g.add(dough,ice);
    const cols=['#FFFFFF','#FFD43B','#4DABF7','#69DB7C','#9775FA','#FF6B6B'];
    const sg=new THREE.CapsuleGeometry(.035,.14,4,8);
    for(let i=0;i<38;i++){
      const u=Math.random()*Math.PI*2, v=.35+Math.random()*1.0;
      if(Math.abs(u+Math.PI/2)<.55&&v>.6)continue; // keep face area clear
      const r=.47*.8;const p=new THREE.Vector3((1+.47*Math.cos(v))*Math.cos(u),(1+.47*Math.cos(v))*Math.sin(u),.13+r*Math.sin(v)/.8*.8+.02);
      const s=new THREE.Mesh(sg,phys(cols[i%cols.length],{roughness:.3}));s.position.copy(p);s.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);g.add(s);
    }
    g.rotation.x=-.42;
    const a=new THREE.Object3D();a.position.set(0,-1,.52);g.add(a);g.userData.face=a;g.userData.fs=.95;return g;
  },
  pilly(){
    const g=new THREE.Group(),R=.66,H=.95;
    const mk=(c,top)=>{const h=new THREE.Group();
      const cyl=new THREE.Mesh(new THREE.CylinderGeometry(R,R,H,64,1,true),phys(c));cyl.position.y=(top?1:-1)*H/2;
      const sp=new THREE.Mesh(new THREE.SphereGeometry(R,64,32,0,Math.PI*2,0,Math.PI/2),phys(c));sp.position.y=(top?1:-1)*H;if(!top)sp.rotation.x=Math.PI;
      h.add(cyl,sp);return h};
    g.add(mk('#FF5544',true),mk('#FFF3E2',false));
    const band=new THREE.Mesh(new THREE.TorusGeometry(R,.025,8,96),phys('#E8D9C4'));band.rotation.x=Math.PI/2;g.add(band);
    g.rotation.z=-.62;
    const a=new THREE.Object3D();a.position.set(0,-.42,R);g.add(a);g.userData.face=a;g.userData.fs=.95;return g;
  },
  morel(){
    const g=new THREE.Group();
    const cap=new THREE.Mesh(new THREE.SphereGeometry(1.35,96,48,0,Math.PI*2,0,Math.PI/2),phys('#E8384F',{roughness:.2}));
    cap.scale.set(1,.78,1);cap.position.y=.25;
    const under=new THREE.Mesh(new THREE.CylinderGeometry(1.33,1.12,.16,96),phys('#F6E2C6',{roughness:.6,clearcoat:.2}));under.position.y=.18;
    const sp=[];for(let i=0;i<=24;i++){const t=i/24;const y=-1.15+t*1.4;const r=.52+.1*Math.sin(t*Math.PI*.9)+(t<.12?-(.12-t)*2.6:0);sp.push(new THREE.Vector2(Math.max(.02,r),y))}
    const stem=new THREE.Mesh(new THREE.LatheGeometry(sp,96),phys('#FFF2DD',{roughness:.35}));
    g.add(stem,under,cap);
    const dots=[[0,.95,.55,.28],[-.75,.62,.68,.2],[.72,.66,.66,.22],[-.3,.5,1.12,.16],[.4,.46,1.1,.14],[0,.98,-.2,.2],[-1.05,.36,.3,.16],[1.05,.38,.28,.15]];
    for(const[x,y,z,r]of dots){const d=new THREE.Mesh(new THREE.SphereGeometry(r,32,16),phys('#FFFFFF',{roughness:.3}));d.scale.set(1,.45,1);
      const n=new THREE.Vector3(x,(y-.25)/.78,z).normalize();d.position.set(n.x*1.35,.25+n.y*1.35*.78,n.z*1.35);d.lookAt(d.position.clone().add(n));d.rotateX(Math.PI/2);g.add(d)}
    g.rotation.x=.22;g.rotation.z=.06;
    const a=new THREE.Object3D();a.position.set(0,-.42,.62);g.add(a);g.userData.face=a;g.userData.fs=.8;return g;
  },
  bolt(){
    const s=new THREE.Shape();
    const P=[[.22,1.6],[-.95,-.08],[-.08,-.08],[-.5,-1.6],[.95,.28],[.08,.28],[.62,1.6]];
    s.moveTo(...P[0]);for(let i=1;i<P.length;i++)s.lineTo(...P[i]);s.closePath();
    const geo=new THREE.ExtrudeGeometry(s,{depth:.32,bevelEnabled:true,bevelThickness:.26,bevelSize:.2,bevelSegments:10,curveSegments:8});
    geo.center();
    const m=new THREE.Mesh(geo,phys('#FFD24A',{metalness:.55,roughness:.16,envMapIntensity:1.6,sheen:.4,sheenColor:new THREE.Color('#fff2b0')}));
    const g=new THREE.Group();g.add(m);g.rotation.y=-.28;g.rotation.x=.1;
    const a=new THREE.Object3D();a.position.set(.02,.12,.42);g.add(a);g.userData.face=a;g.userData.fs=.72;return g;
  },
  cloud(){
    const g=new THREE.Group();
    const cv=document.createElement('canvas');cv.width=256;cv.height=16;const cx=cv.getContext('2d');const lg=cx.createLinearGradient(0,0,256,0);
    ['#ffd1e8','#c9f0ff','#d8ffe0','#fff2c2','#e6d1ff','#ffd1e8'].forEach((c,i,a)=>lg.addColorStop(i/(a.length-1),c));cx.fillStyle=lg;cx.fillRect(0,0,256,16);
    const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.repeat.set(2,1);tex.wrapS=THREE.RepeatWrapping;
    const mat=phys('#ffffff',{map:tex,metalness:.15,roughness:.1,iridescence:1,iridescenceIOR:1.8,iridescenceThicknessRange:[120,980]});
    for(const[x,y,r]of[[-.9,-.12,.74],[0,.3,.98],[.9,-.08,.72],[-.35,-.42,.7],[.42,-.42,.7]]){
      const sp=new THREE.Mesh(new THREE.SphereGeometry(r,64,48),mat);sp.position.set(x,y,0);sp.scale.z=.72;g.add(sp)}
    g.rotation.y=.12;
    const a=new THREE.Object3D();a.position.set(0,-.12,.7);g.add(a);g.userData.face=a;g.userData.fs=1.05;return g;
  },
};
async function renderMascots(){
  const size=640;
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  r.setPixelRatio(1);r.setSize(size,size,false);
  r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;r.outputColorSpace=THREE.SRGBColorSpace;
  const pm=new THREE.PMREMGenerator(r);const env=pm.fromScene(new RoomEnvironment(),.04).texture;
  const cam=new THREE.PerspectiveCamera(28,1,.1,100);cam.position.set(0,0,9);cam.lookAt(0,0,0);
  for(const k of Object.keys(B)){
    const sc=new THREE.Scene();sc.environment=env;
    const key=new THREE.DirectionalLight(0xffffff,1.5);key.position.set(-3,4,5);sc.add(key);
    const rim=new THREE.DirectionalLight(0xffffff,.9);rim.position.set(4,-2,-3);sc.add(rim);
    sc.add(new THREE.AmbientLight(0xffffff,.25));
    const g=B[k]();const holder=new THREE.Group();holder.add(g);sc.add(holder);
    holder.updateMatrixWorld(true);

    const kind=Math.random()<.5?'rect':Math.random()<.6?'circ':'star';
    parts.push({x:x+rnd(-60,60)*s,y:y+rnd(-6,6),vx:Math.sin(a)*sp,vy:-Math.cos(a)*sp,g:900,life:rnd(3.5,6),age:0,kind,
      size:kind==='rect'?rnd(5,9):kind==='circ'?rnd(2.5,4.5):rnd(4,7),rot:rnd(0,6),vr:rnd(-8,8),col:CONF[i%CONF.length],flip:rnd(0,6),flipV:rnd(4,12),sway:rnd(0,6)});

  // fade the tips
  const tg=gS.createRadialGradient(x,y,L*.72,x,y,L);tg.addColorStop(0,'rgba(0,0,0,0)');tg.addColorStop(1,'rgba(0,0,0,.85)');gS.fillStyle=tg;gS.fillRect(x-L,y-L,2*L,2*L);
  gS.restore();
}
function drawParts(dt){
  gC.clearRect(0,0,VW,VH);
  parts=parts.filter(p=>p.age<p.life&&p.y<VH+40);
  for(const p of parts){
    p.age+=dt;const drag=Math.exp(-(p.kind==='spark'?3:2.4)*dt);
    p.vx*=drag;p.vy=p.vy*drag+p.g*dt;
    if(p.kind!=='spark'){const term=150;if(p.vy>term)p.vy=term;p.vx+=Math.sin(p.age*3+p.sway)*20*dt}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.flip+=p.flipV*dt;
    const fade=Math.min(1,(p.life-p.age)/.6);
    gC.save();gC.globalAlpha=fade;gC.translate(p.x,p.y);gC.rotate(p.rot);gC.fillStyle=p.col;
    if(p.kind==='rect'){gC.scale(1,Math.cos(p.flip));gC.beginPath();gC.roundRect(-p.size/2,-p.size*.32,p.size,p.size*.64,1.2);gC.fill()}
    else if(p.kind==='circ'){gC.scale(Math.cos(p.flip)*.4+.6,1);gC.beginPath();gC.arc(0,0,p.size,0,7);gC.fill()}
    else if(p.kind==='star'){drawStar(gC,p.size)}
    else{gC.beginPath();gC.arc(0,0,Math.max(0,p.size*(1-p.age/p.life)),0,7);gC.fill()}
    if(p.col==='#FFFFFF'){gC.strokeStyle='rgba(0,0,0,.08)';gC.lineWidth=.6;gC.stroke()}
    gC.restore();
  }
}

/* ================= main loop ================= */
let state='loading',last=performance.now(),mouse={x:0,y:0};
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&state==='pack'){e.preventDefault();tearAuto()}});
function tick(now){
  try{frame(now)}catch(e){console.error(e)}
  requestAnimationFrame(tick);
}
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  /* pack */
  const pk=pack;
  if(pk){
    if(pk.enter){
      const t=Math.min(1,(now-pk.enter.t0)/pk.enter.dur),e=ease.oc(t);
      pk.spin=reduce?0:(1-e)*540;pk.x.t=0; // reduced motion: slide in without the spin
      pk.enterLift=(1-e)*-30;
      if(t>=1)pk.enter=null;
    }
    const idle=state==='pack';
    const tearAct=now-(pk.tearing||0)<120;
    pk.rx.t=idle?-(pk.hy||0)*10:0;pk.ry.t=idle?(pk.hx||0)*14:0;
    pk.rz.t=tearAct?Math.sin(now/30)*1.2:0;
    if(pk.shake>0){pk.rz.t+=Math.sin(now/26)*4*pk.shake;pk.shake=Math.max(0,pk.shake-dt*2.6)}
    for(const s of[pk.x,pk.y,pk.rx,pk.ry,pk.rz])for(let k=0;k<2;k++)s.step(dt/2);
    let fy=0,fr=0,fo=1;
    if(pk.fall){const t=(now-pk.fall.t0)/750;fy=ease.ic(Math.min(t,1))*VH*.9;fr=ease.ic(Math.min(t,1))*24*pk.fall.dir;fo=t>.8?Math.max(0,1-(t-.8)/.2):1}
    const bob=state==='pack'?Math.sin(now/900)*5:0;
    const s=packS;
    pk.el.style.transform=`translate(${(CX+pk.x.v-150).toFixed(2)}px,${(CY+pk.y.v-208+bob+fy+(pk.enterLift||0)).toFixed(2)}px) scale(${s}) rotate(${fr.toFixed(2)}deg)`;
    pk.el.style.opacity=fo;
    pk.p3.style.transform=`perspective(1400px) rotateX(${pk.rx.v.toFixed(2)}deg) rotateY(${(pk.ry.v+pk.spin).toFixed(2)}deg) rotateZ(${pk.rz.v.toFixed(2)}deg)`;
    pk.shadow.style.transform=`scale(${(1-bob/60).toFixed(3)})`;pk.shadow.style.opacity=pk.fall?0:1;
    pk.sheen.style.setProperty('--sx',(55+(pk.hx||0)*-60)+'%');
    if(pk.progress>0&&!pk.fly)placeSlices(pk);
    if(pk.fly){const f=pk.fly;f.vy+=1500*dt*packS;f.x+=f.vx*dt;f.y+=f.vy*dt;f.r+=f.vr*dt;
      pk.strip.style.transform=`translate(${(f.x/s).toFixed(1)}px,${(f.y/s).toFixed(1)}px) rotate(${f.r.toFixed(1)}deg)`;pk.strip.style.transformOrigin='100% 0'}
    if(pk.face){
      if(state==='pack'&&pk.face.expr==='idle'){const r=pk.el.getBoundingClientRect();pk.face.lx=Math.max(-3,Math.min(3,(mouse.x-(r.left+r.width/2))/90));pk.face.ly=Math.max(-2.5,Math.min(2.5,(mouse.y-(r.top+r.height*.55))/90))}
      pk.face.tick(now)}
    if(fo<=0&&pk.fall){pk.el.remove();pack=null}
  }
  /* cards */
  for(const c of cards){
    if(c.exit){const t=(now-c.exit.t0)/1000;c.y.t=c.y.v;c.x.t=c.x.v;
      c.y.snap(c.y.v+(t*t*2600+60)*dt);c.x.snap(c.x.v+c.exit.vx*dt);c.r.snap(c.r.v+c.exit.vr*dt);c.el.style.opacity=Math.max(0,1-t*1.6)}
    const hv=c.hover&&state==='row';
    if(state==='row'||state==='swapping'){c.rx.t=hv?(.5-c.py)*18:0;c.ry.t=hv?(c.px-.5)*22:0}
    c.lift.t=hv?1:0;
    for(const s of[c.x,c.y,c.r,c.s,c.rx,c.ry,c.lift])for(let k=0;k<2;k++)s.step(dt/2);
    const sc=cardW/300*c.s.v*(1+c.lift.v*.07),rot=c.r.v*(1-c.lift.v);
    c.el.style.transform=`translate(${(CX+c.x.v-150).toFixed(2)}px,${(CY+c.y.v-212-c.lift.v*cardW*.06).toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
    c.inner.style.transform=`perspective(1100px) rotateX(${c.rx.v.toFixed(2)}deg) rotateY(${c.ry.v.toFixed(2)}deg)`;
    const fx=50+(c.px-.5)*90+c.ry.v*.6,fy=50+(c.py-.5)*90;
    c.inner.style.setProperty('--fx',fx.toFixed(1)+'%');c.inner.style.setProperty('--fy',fy.toFixed(1)+'%');
    c.inner.style.setProperty('--gx',(c.px*100).toFixed(1)+'%');c.inner.style.setProperty('--gy',(c.py*100).toFixed(1)+'%');
    const bob=Math.sin(now/1100+c.bob)*4;
    c.mascot.style.transform=`translate(${((c.px-.5)*-14).toFixed(2)}px,${((c.py-.5)*-10+bob).toFixed(2)}px) scale(${1+c.lift.v*.04})`;
    if(c.face){if(c.face.expr==='idle'){c.face.lx=(c.px-.5)*5;c.face.ly=(c.py-.5)*4}c.face.tick(now)}
  }
  drawStreams(now);drawParts(dt);
}

/* ================= boot ================= */
layout();addEventListener('resize',layout);
try{await renderMascots()}catch(e){console.warn('mascot render failed',e)}
const first=makePack();state='pack';first.y.snap(30);first.el.style.opacity=0;
requestAnimationFrame(()=>{first.y.t=0;first.el.style.transition='opacity .5s ease';first.el.style.opacity=1;setTimeout(()=>first.el.style.transition='',600)});
requestAnimationFrame(tick);
</script>
</body>
